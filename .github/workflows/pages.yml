name: İçeriği doğrula ve yayımla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Hazır web dosyalarını aç
        run: |
          mkdir _site
          unzip -q web-app.zip -d _site
          cp project-data.json project-authors.json _site/
      - name: İçerik ve öğrenci künyesini doğrula
        run: cd _site && node ../validate-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Yayımla
        id: deployment
        uses: actions/deploy-pages@v4
